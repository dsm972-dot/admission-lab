                \ = String(get(wifiId)?.state ?? '').trim();\n  const connectedSSID\
                \ = !noData.has(ssid.toLowerCase());\n  let text = 'Non renseignée',\
                \ ico = 'mdi:help-network-outline';\n  if (['wifi', 'wi-fi', 'wi_fi'].includes(net))\
                \ { text = 'Wi-Fi'; ico = 'mdi:wifi'; }\n  else if (['cellular', 'mobile',\
                \ 'mobile data'].includes(net)) {\n    const generation = normalized(mobileId).replace(/[\
                \ _-]/g, '');\n    const types = {gprs:'2G',edge:'2G',gsm:'2G',cdma:'2G','1xrtt':'2G',umts:'3G',hspa:'3G',hsdpa:'3G',hsupa:'3G',hspap:'3G',wcdma:'3G',evdo0:'3G',evdoa:'3G',evdob:'3G',tdscdma:'3G',lte:'4G',lteca:'4G',nr:'5G',nrnsa:'5G',nrsa:'5G','2g':'2G','3g':'3G','4g':'4G','5g':'5G'};\n\
                \    text = types[generation] || 'Mobile'; ico = 'mdi:signal-cellular-3';\n\
                \  } else if (['none', 'offline', 'not connected', 'disconnected'].includes(net))\
                \ { text = 'Sans connexion'; ico = 'mdi:network-off-outline'; }\n\
                \  else if (net === 'ethernet') { text = 'Ethernet'; ico = 'mdi:ethernet';\
                \ }\n  else if (connectedSSID) { text = 'Wi-Fi'; ico = 'mdi:wifi';\
                \ }\n  const title = text === 'Wi-Fi' && connectedSSID ? ssid : text;\n\
                \  return `<small class=\"person-detail connection\">${icon(ico)}<span\
                \ title=\"${esc(title)}\">${esc(text)}</span></small>`;\n};\nconst\
                \ batteryDetail = id => {\n  const raw = String(get(id)?.state ??\
                \ '').trim();\n  const n = raw !== '' ? Number(raw) : NaN;\n  const\
                \ valid = Number.isFinite(n) && n >= 0 && n <= 100;\n  const step\
                \ = valid ? Math.floor(n / 10) * 10 : null;\n  const ico = !valid\
                \ ? 'mdi:battery-unknown' : step === 100 ? 'mdi:battery' : step ===\
                \ 0 ? 'mdi:battery-outline' : `mdi:battery-${step}`;\n  const text\
                \ = valid ? n.toLocaleString('fr-FR',{maximumFractionDigits:0}) +\
                \ ' %' : 'Indisponible';\n  return `<small class=\"person-detail battery\"\
