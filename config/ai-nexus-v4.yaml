title: AI Nexus Home V4
button_card_templates:
  glass:
    show_state: false
    tap_action:
      action: none
    hold_action:
      action: none
    double_tap_action:
      action: none
    state:
    - value: 'on'
      styles:
        icon:
        - color: '#1f8fff'
        card:
        - box-shadow: 'inset 3px 0 0 #1f8fff, 0 10px 28px rgba(16,52,84,.08)'
    - value: open
      styles:
        icon:
        - color: '#1f8fff'
        card:
        - box-shadow: 'inset 3px 0 0 #1f8fff, 0 10px 28px rgba(16,52,84,.08)'
    - value: heat
      styles:
        icon:
        - color: '#e07a3d'
        card:
        - box-shadow: 'inset 3px 0 0 #e07a3d, 0 10px 28px rgba(16,52,84,.08)'
    - value: playing
      styles:
        icon:
        - color: '#1f8fff'
    - value: 'off'
      styles:
        icon:
        - color: '#8aa0b4'
    - value: closed
      styles:
        icon:
        - color: '#8aa0b4'
    - value: unavailable
      styles:
        card:
        - opacity: '0.62'
        - border: 1px dashed rgba(90,112,130,.45)
        icon:
        - color: '#93a3b3'
    - value: unknown
      styles:
        card:
        - opacity: '0.62'
        - border: 1px dashed rgba(90,112,130,.45)
        icon:
        - color: '#93a3b3'
    styles:
      card:
      - border-radius: 22px
      - padding: 16px 18px
      - min-height: 92px
      - background: var(--ha-card-background)
      - border: 1px solid var(--divider-color)
      - box-shadow: 0 10px 28px rgba(16,52,84,.08)
      - backdrop-filter: blur(16px)
      name:
      - white-space: normal
      - font-weight: '650'
      - font-size: 15px
      - letter-spacing: -0.01em
      state:
      - white-space: normal
      - font-size: 13px
      - font-weight: '600'
      label:
      - white-space: normal
      icon:
      - color: var(--primary-color)
      - width: 26px
views:
- title: Accueil
  path: accueil
  icon: mdi:home
  type: sections
  max_columns: 4
  theme: AI Nexus Glass
  sections:
  - type: grid
    column_span: 4
    cards:
    - type: custom:button-card
      name: Bandeau photographique
      show_name: false
      show_icon: false
      tap_action:
        action: none
      hold_action:
        action: none
      double_tap_action:
        action: none
      triggers_update:
      - person.denis
      - person.laura
      - person.emile
      - person.maddy
      - input_select.house_mode
      - weather.forecast_maison
      custom_fields:
        body: '[[[


          const esc = v => String(v ?? '''').replace(/[&<>"'']/g,c=>({''&'':''&amp;'',''<'':''&lt;'',''>'':''&gt;'',''"'':''&quot;'',"''":''&#39;''}[c]));

          const usable = s => s && ![''unknown'',''unavailable'',''''].includes(s.state);

          const people = ["person.denis", "person.laura", "person.emile", "person.maddy"];

          const known = people.filter(id=>usable(states[id]));

          const count = known.filter(id=>states[id].state===''home'').length;

          const presence = known.length===people.length && people.length ? `${count}/${people.length}
          présents` : `${count} présence(s) confirmée(s) · ${people.length-known.length}
          non renseignée(s)`;

          const mode = states["input_select.house_mode"];

          const wx = states["weather.forecast_maison"];

          const raw = wx?.attributes?.temperature;

          const numeric = raw !== null && raw !== undefined && String(raw).trim()
          !== '''' && Number.isFinite(Number(raw));

          const unit = wx?.attributes?.temperature_unit;

          const temperature = usable(wx) && numeric && unit ? `${Number(raw).toLocaleString(''fr-FR'')}
          ${esc(unit)}` : ''Température indisponible'';

          const names = {sunny:''Ensoleillé'',partlycloudy:''Quelques nuages'',cloudy:''Nuageux'',rainy:''Pluie'',''clear-night'':''Nuit
          claire'',pouring:''Forte pluie'',fog:''Brouillard'',snowy:''Neige'',''snowy-rainy'':''Pluie
          et neige'',lightning:''Orage'',''lightning-rainy'':''Pluie orageuse'',windy:''Vent'',''windy-variant'':''Vent
          et nuages'',exceptional:''Conditions exceptionnelles'',hail:''Grêle''};

          const condition = usable(wx) ? names[wx.state] || esc(wx.state) : ''Météo
          indisponible'';

          const date = new Date().toLocaleDateString(''fr-FR'',{weekday:''long'',day:''numeric'',month:''long'',timeZone:(typeof
          hass !== ''undefined'' && hass?.config?.time_zone) || ''Europe/Paris''});

          return `<style>

          .nexus03{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;min-width:0;color:var(--primary-text-color);overflow-wrap:anywhere}

          .nexus03 h2{margin:0;font-size:clamp(24px,2.7cqi,40px);line-height:1.1}.nexus03
          p{margin:6px 0;font-size:13px}.nexus03 .chips{display:flex;flex-wrap:wrap;gap:6px}.nexus03
          .chip{border-radius:16px;padding:5px 9px;background:rgba(90,160,180,.13);font-size:12px}.nexus03
          .current{text-align:right;min-width:0}.nexus03 strong{font-size:24px}.nexus03
          small{display:block;font-size:12px}

          @container(max-width:650px){.nexus03{grid-template-columns:1fr}.nexus03
          .current{text-align:left}.nexus03 h2{font-size:24px}}

          </style><div class="nexus03"><div><h2>Bonjour Denis</h2><p>${esc(date)}</p><div
          class="chips"><span class="chip">${presence}</span><span class="chip">Mode
          ${usable(mode)?esc(mode.state):''indisponible''}</span></div></div><div
          class="current"><strong>${temperature}</strong><small>${condition}</small><small>Prévisions
          HA : si absentes, données indisponibles.</small></div></div>`;


          ]]]'
        forecast:
          card:
            type: weather-forecast
            entity: weather.forecast_maison
            show_current: false
            show_forecast: true
            forecast_type: daily
            tap_action:
              action: more-info
      styles:
        card:
        - border-radius: 20px
        - background: var(--ha-card-background)
        - border: 1px solid var(--divider-color)
        - box-shadow: 0 4px 18px rgba(30,65,91,.08)
        - overflow: hidden
        - container-type: inline-size
        - background: linear-gradient(90deg,var(--ha-card-background) 8%,var(--ha-card-background)
            40%,transparent 100%), url('/local/ai-nexus-v4/visual/hero.webp') center/cover
        - padding: 12px 16px
        grid:
        - grid-template-areas: '"body forecast"'
        - grid-template-columns: minmax(0,1fr) minmax(280px,360px)
        - gap: 12px
        - align-items: center
        custom_fields:
          body:
          - width: 100%
          - min-width: '0'
          - white-space: normal
          forecast:
          - width: 100%
          - min-width: '0'
          - white-space: normal
      section_mode: true
      grid_options:
        columns: full
        rows: auto
      extra_styles: '@container(max-width:760px){#container{grid-template-columns:minmax(0,1fr)!important;grid-template-areas:"body"
        "forecast"!important}}'
    - type: custom:button-card
