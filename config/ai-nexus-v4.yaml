            custom_fields:
              body: "[[[[\n\nconst esc = v => String(v ?? '').replace(/[&<>\"']/g,\
                \ c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n\
                const get = id => states[id];\nconst ok = id => !!get(id) && !['unknown','unavailable',''].includes(get(id).state);\n\
                const number = id => ok(id) && Number.isFinite(Number(get(id).state))\
                \ ? Number(get(id).state) : null;\nconst value = (id, unit = '') =>\
