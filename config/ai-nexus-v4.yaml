                const progress = id => {const n = number(id); return n === null ?\
                \ '' : `<div class=\"bar\"><i style=\"width:${Math.max(0,Math.min(100,n))}%\"\
                ></i></div>`;};\n\n\nconst normalized = id => String(get(id)?.state\
                \ ?? '').trim().toLowerCase();\nconst noData = new Set(['', 'unknown',\
                \ 'unavailable', 'null', 'undefined', 'none', 'not connected', '<not\
