            - sensor.tel_maddy_wi_fi_connection
            custom_fields:
              body: "[[[[\n\nconst esc = v => String(v ?? '').replace(/[&<>\"']/g,\
                \ c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n\
                const get = id => states[id];\nconst ok = id => !!get(id) && !['unknown','unavailable',''].includes(get(id).state);\n\
                const number = id => ok(id) && Number.isFinite(Number(get(id).state))\
                \ ? Number(get(id).state) : null;\nconst value = (id, unit = '') =>\
                \ ok(id) ? esc(get(id).state) + (unit ? ' ' + esc(unit) : '') : 'Indisponible';\n\
                const unitValue = id => value(id, get(id)?.attributes?.unit_of_measurement\
                \ || '');\nconst translated = (id, map = {}) => ok(id) ? esc(map[get(id).state]\
                \ ?? get(id).state) : 'Indisponible';\nconst icon = name => `<ha-icon\
                \ icon=\"${esc(name)}\"></ha-icon>`;\nconst label = (name, text, ico\
