                const unitValue = id => value(id, get(id)?.attributes?.unit_of_measurement\
                \ || '');\nconst translated = (id, map = {}) => ok(id) ? esc(map[get(id).state]\
                \ ?? get(id).state) : 'Indisponible';\nconst icon = name => `<ha-icon\
                \ icon=\"${esc(name)}\"></ha-icon>`;\nconst label = (name, text, ico\
                \ = '') => `<div class=\"metric\">${ico ? icon(ico) : ''}<div><small>${esc(name)}</small><strong>${text}</strong></div></div>`;\n\
                const progress = id => {const n = number(id); return n === null ?\
                \ '' : `<div class=\"bar\"><i style=\"width:${Math.max(0,Math.min(100,n))}%\"\
                ></i></div>`;};\n\nconst people=[\"person.denis\", \"person.laura\"\
                , \"person.emile\", \"person.maddy\"]; const knownPresence=id=>ok(id)\
                \ && get(id)?.attributes?.restored!==true && !['null','undefined','none'].includes(String(get(id).state).trim().toLowerCase());\
                \ const known=people.filter(knownPresence); const home=known.filter(id=>get(id).state==='home').length;\
                \ const unknown=people.length-known.length; const presence=home+'\
                \ présent'+(home>1?'s':'')+' / '+people.length+(unknown?' · '+unknown+'\
