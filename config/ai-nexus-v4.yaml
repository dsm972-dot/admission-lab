                <style>\n*{box-sizing:border-box}.panel{text-align:left;color:var(--primary-text-color);font-family:var(--paper-font-body1_-_font-family,system-ui);width:100%;min-width:0;overflow-wrap:anywhere}\n\
                .panel ha-icon{width:20px;height:20px;--mdc-icon-size:20px;display:inline-flex}h2,h3,p{margin:0}h2{font-size:17px;letter-spacing:-.3px}h3{font-size:15px}small{font-size:12px;color:var(--secondary-text-color);display:block}strong{font-size:14px;display:block;overflow-wrap:anywhere;word-break:keep-all}.muted{color:var(--secondary-text-color);font-size:12px}.head{display:flex;align-items:center;gap:8px;margin-bottom:12px}.head>ha-icon{color:#378ec8;width:21px}.head\
                \ .arrow{margin-left:auto;opacity:.5}.metric{display:flex;align-items:center;gap:8px;min-width:0;white-space:normal}.metric>div{min-width:0}.head\
                \ h2{min-width:0;overflow-wrap:anywhere}.metric>ha-icon{width:18px;height:18px;color:#478fae;flex-shrink:0}\n\
                /* button-card injecte :not(ha-state-icon) ha-icon{margin:auto} :\
                \ en flex cela\n   pousse l'icone au centre de l'espace libre et l'ejecte\
                \ de son libelle.\n   Specificite .panel .x>ha-icon (0,2,1) > regle\
                \ button-card (0,1,1). */\n.panel .metric>ha-icon,.panel .head>ha-icon,.panel\
                \ .person>ha-icon,.panel .person-detail>ha-icon,.nexus07 .n7-row>ha-icon,.nexus07\
                \ h2>ha-icon{margin-left:0!important;margin-right:0!important}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px\
                \ 12px}.bar{height:6px;background:rgba(62,133,170,.14);border-radius:9px;overflow:hidden;margin-top:8px}.bar\
                \ i{display:block;height:100%;background:#3ca59b;border-radius:9px}.pill{padding:6px\
                \ 12px;border-radius:20px;background:rgba(73,168,140,.13);font-size:12px;white-space:normal;overflow-wrap:anywhere}.photo{width:100%;object-fit:cover;border-radius:12px;display:block}.product{height:82px;object-fit:contain;margin:10px\
                \ 0;width:100%;border-radius:12px}.footer{font-size:11px;color:var(--secondary-text-color);margin-top:14px;opacity:.8}.room\
                \ .photo{height:110px;border-radius:15px 15px 0 0}.room .room-info{padding:14px}.room\
                \ .head{margin-bottom:10px}.room .metrics{gap:10px}.room .metric strong{font-size:13px}.room\
                \ .metric small{font-size:10px}.room .footer{margin-top:10px}.coverline{font-size:11px;margin-top:9px;color:var(--secondary-text-color)}\n\
                /* Mobile first responsive */\n@container(max-width:480px){.metrics{grid-template-columns:1fr;gap:10px}.metric{justify-content:flex-start}.room\
                \ .photo{height:120px}.room .metrics{gap:8px}.pill{font-size:11px;padding:5px\
                \ 10px}.head{gap:6px}.head>ha-icon{width:19px}}\n@container(max-width:600px){.room\
                \ .photo{height:105px}.metrics{gap:10px}.head{margin-bottom:10px}}\n\
                </style>\n<style>.people{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.person{display:flex;align-items:center;gap:10px;min-width:0}.person>ha-icon{border-radius:50%;padding:8px;width:44px;height:44px;color:#3d8dae;background:rgba(89,159,190,.14);flex-shrink:0}.person>div{min-width:0;overflow-wrap:anywhere}.person\
                \ small{margin-top:4px}.person .person-detail{display:flex;align-items:center;gap:5px;line-height:1.35}.person-detail>ha-icon{width:15px;height:15px;--mdc-icon-size:15px;flex-shrink:0;color:#478fae}.person-detail>span{min-width:0;white-space:normal}.person\
                \ .battery{color:#53765b}@container(max-width:600px){.people{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px\
                \ 10px}.person>ha-icon{width:34px;height:34px;padding:5px}.person{gap:8px}.person\
                \ h3{font-size:14px}.person small{font-size:11px}}@container(max-width:320px){.people{grid-template-columns:1fr;gap:12px}.person>ha-icon{width:40px;height:40px;padding:7px}.person\
                \ small{font-size:12px}}</style><div class=\"panel\"><div class=\"\
                head\">${icon(\"mdi:account-group\")}<h2>Famille</h2><span class=\"\
                arrow\">›</span></div><div class=\"people\"><div class=\"person\"\
                >${icon(\"mdi:account\")}<div><h3>Denis</h3><small class=\"presence\"\
                >${translated(\"person.denis\",{\"home\": \"À la maison\", \"not_home\"\
                : \"Absent\"})}</small>${connection(\"sensor.s25_denis_wi_fi_connection\"\
                ,\"sensor.s25_denis_network_type\",\"sensor.s25_denis_data_network_type_sim_1\"\
                )}${batteryDetail(\"sensor.s25_denis_battery_level\")}</div></div><div\
                \ class=\"person\">${icon(\"mdi:account\")}<div><h3>Laura</h3><small\
                \ class=\"presence\">${translated(\"person.laura\",{\"home\": \"À\
                \ la maison\", \"not_home\": \"Absent\"})}</small>${connection(\"\
                sensor.laura_wifi_connection\",\"sensor.laura_network_type\",\"sensor.laura_data_network_type_sim_1\"\
                )}${batteryDetail(\"sensor.laura_battery_level\")}</div></div><div\
                \ class=\"person\">${icon(\"mdi:account-school\")}<div><h3>Émile</h3><small\
                \ class=\"presence\">${translated(\"person.emile\",{\"home\": \"À\
                \ la maison\", \"not_home\": \"Absent\"})}</small>${connection(\"\
                sensor.emile_wi_fi_connection\",null,null)}${batteryDetail(\"sensor.emile_battery_level\"\
                )}</div></div><div class=\"person\">${icon(\"mdi:account-school\"\
                )}<div><h3>Maddy</h3><small class=\"presence\">${translated(\"person.maddy\"\
                ,{\"home\": \"À la maison\", \"not_home\": \"Absent\"})}</small>${connection(\"\
                sensor.tel_maddy_wi_fi_connection\",null,null)}${batteryDetail(\"\
                sensor.tel_maddy_battery_level\")}</div></div></div></div>`;\n]]]]"
            styles:
              card:
              - padding: 16px
              - border-radius: 20px
