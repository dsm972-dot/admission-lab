# AI Nexus Glass Theme - CSS Variables & Configuration
# Dark mode (default)

# ============================================
# COLORS
# ============================================

# Backgrounds
background.primary: "#0a0a0f"
background.secondary: "#12121a"
background.glass: { value: "rgba(255, 255, 255, 0.08)", border_style: "solid", blur: 12 }

# Primary / Brand colors
brand.primary: "#6366f1"           # Indigo-500
brand.primary.light: "#818cf8"     # Indigo-400
brand.primary.dark: "#4f46e5"      # Indigo-600

# Accent colors for states
accent.success: "#22c55e"          # Green-500
accent.warning: "#eab308"          # Yellow-500
accent.error: "#ef4444"            # Red-500
accent.info: "#06b6d4"             # Cyan-500

# Text colors
text.primary: "#f8fafc"            # Slate-50
text.secondary: "#94a3b8"          # Slate-400

# Borders
border.default: "rgba(255, 255, 255, 0.1)"
border.focus: "rgba(99, 102, 241, 0.5)"  # Primary with opacity

# Light mode backgrounds
background.light.primary: "#f8fafc"        # Slate-50
background.light.secondary: "#f1f5f9"      # Slate-100
background.light.glass: { value: "rgba(255, 255, 255, 0.7)", border_style: "solid", blur: 16 }

# Light mode text
text.light.primary: "#0f172a"               # Slate-900
text.light.secondary: "#64748b"             # Slate-500


# ============================================
# SPACING
# ============================================

spacing.xs: 0.25rem
spacing.sm: 0.5rem
spacing.md: 1rem
spacing.lg: 1.5rem
spacing.xl: 2rem
spacing.xxl: 3rem


# ============================================
# BORDER RADIUS
# ============================================

radius.sm: 0.375rem    # 6px
radius.md: 0.5rem       # 8px
radius.lg: 0.75rem     # 12px
radius.xl: 1rem        # 16px
radius.xxl: 1.5rem     # 24px


# ============================================
# SHADOWS (Glassmorphism)
# ============================================

shadow.glass.medium: "0 8px 32px 0 rgba(0, 0, 0, 0.15)"
shadow.glass.large: "0 16px 48px 0 rgba(0, 0, 0, 0.2)"


# ============================================
# TRANSITIONS
# ============================================

transition.default: "all 0.2s ease"
.transition.fast: "all 0.15s ease-out"
.transition.smooth: "all 0.3s ease-in-out"


# ============================================
# GLASSMORPHISM PROPERTIES
# ============================================

glass.backdrop-filter: "blur(12px) saturate(180%)"
glass.base: { backdrop_filter: "blur(12px)", border: "rgba(255, 255, 255, 0.1) 1px solid" }


# ============================================
# STATES (Unavailable / Unknown)
# ============================================

states.unavailable.background: "#1f1f2a"
states.unavailable.text.primary: "#718096"     # Dimmed
states.unavailable.text.secondary: "#4b5563"   # More dim

states.unknown.background: "#0f0f16"
states.unknown.text.primary: "#718096"         # Muted
states.unknown.text.secondary: "#52525b"       # Very muted


# ============================================
# GLASSMORPHISM CSS (Light mode override)
# ============================================

glassmorphism.dark: {
  backdrop_filter: "blur(12px) saturate(180%) brightness(95%)",
  shadow: "0 8px 32px 0 rgba(0, 0, 0, 0.3)",
  border: "rgba(255, 255, 255, 0.15) 1px solid",
  surface_base: "rgba(30, 30, 46, 0.9)",
  hover_surface: "rgba(50, 50, 80, 0.95)"
}

glassmorphism.light: {
  backdrop_filter: "blur(16px) saturate(200%) brightness(98%)",
  shadow: "0 8px 32px 0 rgba(0, 0, 0, 0.08)",
  border: "rgba(0, 0, 0, 0.15) 1px solid",
  surface_base: "rgba(255, 255, 255, 0.85)",
  hover_surface: "rgba(255, 255, 255, 0.95)"
}
